  Hanpan logo lockup with the Latin wordmark: the screen shows it in every UI
  language but Korean (productName() says "Hanpan" there; Korean keeps
  genoffice-logo.svg with "한판").

  Pure black and white, like the Korean lockup: the shell flips it for dark
  themes with a CSS invert filter. The mark is the same as in
  genoffice-logo.svg; the wordmark "Hanpan" is drawn as outlines from
  Liberation Sans Bold (SIL Open Font License 1.1, bundled in apps/docs), so it
  renders the same everywhere without any font.
-->
