name: CI

# Test gate for every PR and push: changed-file formatting, lint, typecheck across
# all workspaces, the unit-test suites (engine packages and app tests; the sheets
# suite also runs the Rust xlsx-sidecar tests) and the Electron e2e. Installers are
# built and published by hand (docs/releasing.ko.md) — this workflow never builds or
# uploads one, and it uses no repository secret.
#
# What runs (tools/ci-changes.mjs, the `changes` job):
# - a PR that touches only docs/, site/, .claude/ or root notes: the `docs` job
#   (formatting, English-only comments) instead of `test` and `e2e`;
# - any other PR: `test` with the unit suites of the touched workspaces and of
#   every workspace that uses them, and the e2e in three parallel shards;
# - a push to main, a manual run, or a PR touching anything shared (lockfile,
#   tools/, workflows, fixtures, tsconfig): every unit suite, as before.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
      full: ${{ steps.pick.outputs.full }}
      workspaces: ${{ steps.pick.outputs.workspaces }}
      sheets: ${{ steps.pick.outputs.sheets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a PR's checkout is its merge commit: HEAD^1 is the main it was built against
          fetch-depth: 2

      - name: Pick what this change runs
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/ci-changes.mjs --event pull_request --base "$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            node tools/ci-changes.mjs --event "${{ github.event_name }}" >> "$GITHUB_OUTPUT"
          fi

  # A PR with no code: the checks that read docs, without installing the build
  docs:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # electron's binary is not needed to format or read comments
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: |
          FORMAT_BASE_REF=$(git rev-parse HEAD^1) npm run format:check

      - name: Check comments/docs are English-only
        run: npm run check:english-comments

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      # electron's postinstall downloads its binary from GitHub Releases on every
      # fresh install; a cache hit skips the download (and its 5xx flakes)
      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          # own prefix: the build workflows' electron-* entries also hold
          # ~/.cache/electron-builder, and a saved key is never updated
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        # a cache miss still downloads electron from GitHub Releases, which
        # answers 5xx now and then: one retry after a pause
        run: npm ci || { echo "::warning::npm ci failed; retrying in 30 s"; sleep 30; npm ci; }

      - name: Check dependency licenses
        run: npm run licenses

      - name: Check Rust dependency licenses (xlsx-sidecar)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/sheets/native/xlsx-engine/Cargo.toml

      - name: Check formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # For PRs the checkout is the PR merge commit, so its first parent is the
        # exact main revision the merge was built against. The event's base.sha can
        # lag behind a fast-moving main, which pulls unrelated main-side files into
        # the changed-file set and fails the check on files the PR never touched.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run format:check

      - name: Check theme colors
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:theme-colors

      # skills/*/SKILL.md ship to users' agent directories; a body change
      # without a metadata.version bump would never be offered as an update.
      - name: Check skill versions
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:skill-version

      # Whole-tree, not changed-files: every one of the manual's 21 languages
      # has to match the English article's structure. A language that quietly
      # falls behind is exactly what no reviewer sees, and it is invisible in a
      # diff — the change that causes it looks like an ordinary translation.
      - name: Check manual language coverage
        run: npm run check:help-langs

      # Keep tracked code comments and contributor-facing documentation
      # English-only; functional CJK strings and AI prompt examples are allowed.
      - name: Check comments/docs are English-only
        run: npm run check:english-comments

      # Whole-tree, lockfile included: the vendor services this product was
      # cut loose from must not come back with a merge of upstream fixes. What
      # may still name the vendor (licence, attribution, identifiers stored in
      # documents) is the allowlist inside the tool.
      - name: Check the removed vendor stays out
        run: npm run check:no-genspark

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regenerate test fixtures
        run: npm run fixtures

      # Generation is byte-deterministic (zip entry mtimes are pinned in
      # tests/helpers/build-docx.ts); a diff here means the generator and the
      # committed fixtures have drifted apart.
      - name: Check committed fixtures match the generator
        run: git diff --exit-code -- fixtures/generated

      # pptx-engine's OOXML schema gate validates saved decks with xmllint
      # (tools/ooxml-validate); the runner image is not guaranteed to have it.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Check what CI picks to run
        run: node --test tools/ci-changes.test.mjs

      # Every picked suite runs to its end and a summary names each failure: one
      # workspace failing no longer hides the ones after it (npm test stops there).
      - name: Test
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.workspaces != ''
        env:
          TEST_ONLY: ${{ needs.changes.outputs.full != 'true' && needs.changes.outputs.workspaces || '' }}
          TEST_JOBS: '1'
        run: node tools/run-workspace-tests.mjs

      # Preservation gate: a no-op-adjacent edit through the OOXML gateway must
      # leave every untouched package entry byte-identical (fails closed otherwise).
      - name: Sheets compatibility gate
        if: needs.changes.outputs.sheets == 'true'
        run: |
          npm run fixtures -w @genoffice/sheets
          npm run compat -w @genoffice/sheets

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.shard }}/3)
    # 22.04, not -latest: 24.04's AppArmor hardening blocks Electron renderer
    # spawn under xvfb even with --no-sandbox and the userns sysctl lifted
    runs-on: ubuntu-22.04
    # A cold font install took 24m in #124; leave room for it as well as setup.
    # Individual test timeouts stay unchanged.
    timeout-minutes: 60
    # the serial Electron suite split by spec file across three runners
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      # electron's postinstall downloads its binary from GitHub Releases on every
      # fresh install; a cache hit skips the download (and its 5xx flakes)
      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          # own prefix: the build workflows' electron-* entries also hold
          # ~/.cache/electron-builder, and a saved key is never updated
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        # a cache miss still downloads electron from GitHub Releases, which
        # answers 5xx now and then: one retry after a pause
        run: npm ci || { echo "::warning::npm ci failed; retrying in 30 s"; sleep 30; npm ci; }

      - name: Build apps
        run: npm run build:all

      - name: Generate sheets fixtures
        run: npm run fixtures -w @genoffice/sheets

      # Newer Ubuntu kernels ship an AppArmor policy that blocks unprivileged
      # user namespaces, which kills the Chromium zygote even with --no-sandbox
      # (window opens, renderer never loads). The knob only exists on kernels
      # that enforce the restriction, so skip it where it is absent instead of
      # failing the job (22.04 runner images vary by kernel).
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      # Pixel baselines (docs-visual.spec.ts) depend on the font stack: pin
      # Calibri/Cambria metric-compatible faces and CJK glyphs so renders are
      # reproducible across runner images and contributor machines.
      # The same packages as an apt install, kept as .deb files: downloading
      # them took about ten minutes a run. Installing the very packages keeps
      # their fontconfig rules too, so the pixel baselines see the same fonts.
      - name: Cache document fonts
        id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ci-font-debs
          key: font-debs-ubuntu-22.04-carlito-caladea-noto-cjk-v1

      - name: Install document fonts (visual baselines)
        run: |
          if [ "${{ steps.fonts.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only \
              fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-cjk
            mkdir -p ~/ci-font-debs
            cp /var/cache/apt/archives/*.deb ~/ci-font-debs/
          fi
          sudo dpkg -i ~/ci-font-debs/*.deb
          fc-list | grep -ciE 'carlito|caladea|noto (sans|serif) cjk'

      # CSS layout tests use standalone Chromium in addition to Electron, in
      # every shard (the e2e layout specs land wherever the split puts them).
      # Keep the pinned document font stack unchanged: --with-deps adds fonts
      # that alter the existing pixel baselines. Electron already supplies the
      # required system libraries on this runner.
      - name: Install Chromium for layout tests
        run: npx playwright install chromium

      - name: Markdown browser tests
        if: matrix.shard == 1
        run: npx playwright test --config apps/markdown/playwright.config.ts

      # Electron needs a display server on Linux runners. DEBUG=pw:browser
      # forwards the Electron process stdout/stderr into the CI log so launch
      # failures are diagnosable.
      - name: E2E (Electron shell)
        env:
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: |
            e2e/artifacts
            e2e/test-results
          retention-days: 7
